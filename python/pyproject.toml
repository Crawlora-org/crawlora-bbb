[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-bbb"
version = "0.6.0"
description = "Crawlora Better Business Bureau API client with 17 endpoints for business search, profiles, complaints, reviews, categories, and ScamTracker reports"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "bbb", "better-business-bureau", "bbb-api", "better-business-bureau-api", "bbb-scraper", "better-business-bureau-scraper", "bbb-data", "better-business-bureau-data", "bbb-business-search", "bbb-profiles", "bbb-complaints", "bbb-reviews", "bbb-categories", "bbb-scamtracker-reports"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=bbb-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=bbb-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-bbb"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_bbb"]

[tool.setuptools.package-data]
"crawlora_bbb" = ["py.typed", "*.pyi"]
